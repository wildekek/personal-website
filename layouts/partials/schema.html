{{- $author := .Site.Params.author -}}
{{- $socialIcons := .Site.Params.socialIcons -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  {{/* Stable @id so the author on every post resolves to this same node. */}}
  "@id": "{{ .Site.BaseURL }}#person",
  "name": "{{ $author.name }}",
  "url": "{{ .Site.BaseURL }}",
  {{/* The avatar is an asset, not a static file, so it is only served once
       something references its Permalink -- hardcoding BaseURL + filename
       pointed at a 404. */}}
  "image": "{{ with resources.Get $author.avatar }}{{ .Permalink }}{{ else }}{{ $.Site.BaseURL }}og-image.jpg{{ end }}",
  "description": "{{ $author.description }}",
  "sameAs": [
    {{- range $index, $icon := $socialIcons -}}
    {{- if $index }},{{ end }}
    "{{ $icon.url }}"
    {{- end -}}
  ]
}
</script>
